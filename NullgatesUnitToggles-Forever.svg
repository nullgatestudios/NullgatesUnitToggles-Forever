<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Unit Toggles - Forever: a unit nameplate above two toggle switches (on / off) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="health" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fdc5a"/>
      <stop offset="1" stop-color="#2c9a2b"/>
    </linearGradient>
    <linearGradient id="onTrack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb4ff"/>
      <stop offset="1" stop-color="#1c6fd1"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d2de"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <!-- nameplate: name, then health bar -->
  <rect x="166" y="96" width="180" height="22" rx="11" fill="#ffd25a"/>
  <rect x="106" y="138" width="300" height="44" rx="10" fill="#0a0d12" stroke="#c9a54e" stroke-width="5"/>
  <rect x="114" y="146" width="206" height="28" rx="5" fill="url(#health)"/>
  <rect x="114" y="146" width="206" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>

  <!-- toggle ON (blue, knob right) -->
  <rect x="78" y="262" width="164" height="88" rx="44" fill="#4fb4ff" opacity="0.55" filter="url(#glow)"/>
  <rect x="78" y="262" width="164" height="88" rx="44" fill="url(#onTrack)" stroke="#9fd6ff" stroke-width="4"/>
  <circle cx="198" cy="306" r="34" fill="url(#knob)"/>
  <path d="M104 306 l14 14 l26 -28" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- toggle OFF (dark, orange outline, knob left) -->
  <rect x="270" y="262" width="164" height="88" rx="44" fill="#ff7a2f" opacity="0.35" filter="url(#glow)"/>
  <rect x="270" y="262" width="164" height="88" rx="44" fill="#1a1f29" stroke="#ff7a2f" stroke-width="5"/>
  <circle cx="314" cy="306" r="34" fill="#4a5262" stroke="#7a8496" stroke-width="3"/>
  <path d="M384 294 l24 24 M408 294 l-24 24" fill="none" stroke="#ff9a5c" stroke-width="10" stroke-linecap="round"/>

  <!-- three small setting dots under the switches -->
  <circle cx="226" cy="408" r="10" fill="#c9a54e"/>
  <circle cx="256" cy="408" r="10" fill="#c9a54e" fill-opacity="0.6"/>
  <circle cx="286" cy="408" r="10" fill="#c9a54e" fill-opacity="0.3"/>
</svg>
